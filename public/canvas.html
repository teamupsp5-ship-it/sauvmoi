<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sauv'Moi — prototype hi-fi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- Thème clair/sombre — même ordre que index.html : expose useTheme(),
       utilisé par frames.jsx et screen-home.jsx (tous deux chargés
       ci-dessous). -->
  <script src="theme.js"></script>

  <!-- i18n FR/EN — même ordre que index.html : fr.js/en.js posent les
       dictionnaires sur window, i18n.js lit sm_lang et expose
       t()/useTranslation()/useLang(), utilisés par la quasi-totalité des
       écrans. Doit être chargé avant les fichiers d'écran ci-dessous. -->
  <script src="i18n/fr.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body style="margin:0; background:#f0eee9;">
  <div id="root"></div>

  <script>
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#E53935",
      "density": "standard",
      "animations": "standard",
      "lang": "FR",
      "dark": false
    }/*EDITMODE-END*/;
  </script>

  <!-- Client API + état partagé — mêmes fichiers et même ordre que
       index.html, avant les écrans : screen-home.jsx (HomeMobile) lit
       window.SM/useSM() et appelle window.API.notifications() au montage
       (échecs déjà interceptés par .catch, sans écran ni backend réel) ;
       screen-training.jsx appelle window.API.trainingModules() sans garde —
       sans api-client.js chargé, window.API est undefined et cet appel lève
       une erreur synchrone (pas une rejection de promesse, donc jamais
       rattrapée par le .catch qui suit). supabase-client.js se dégrade
       proprement sans le SDK Supabase CDN (non chargé ici, inutile pour le
       canvas) — inclus pour que le bouton Google de screen-auth.jsx reste
       utilisable dans le canvas sans lever "getSupabaseClient is not
       defined". -->
  <script src="api-client.js"></script>
  <script src="sm-state.js"></script>
  <script src="supabase-client.js"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="frames.jsx"></script>
  <script type="text/babel" src="screen-home.jsx"></script>
  <script type="text/babel" src="screen-chat.jsx"></script>
  <script type="text/babel" src="screen-sos.jsx"></script>
  <script type="text/babel" src="screen-training.jsx"></script>
  <script type="text/babel" src="screen-auth.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
